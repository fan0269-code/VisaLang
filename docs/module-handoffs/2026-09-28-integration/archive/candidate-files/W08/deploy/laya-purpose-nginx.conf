# Include within the canonical HTTPS server block only when purposeSuggestions is laya or typesafe.
# This file assumes the limit_req_zone below is defined in nginx's http context:
# limit_req_zone $binary_remote_addr zone=visalang_purpose:10m rate=6r/m;
location = /api/purpose-suggestion/ {
    limit_req zone=visalang_purpose burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    client_body_timeout 5s;
    client_body_buffer_size 8k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 15s;
    proxy_pass http://127.0.0.1:8011;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    access_log off;
}
